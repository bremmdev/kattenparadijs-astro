name: Rebuild Site

# Trigger the workflow manually or via the CMS update event
on:
  repository_dispatch:
    types: [cms-update]
  workflow_dispatch:

concurrency:
  group: cms-rebuild
  cancel-in-progress: true # cancel any running builds

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for more changes (debounce)
        if: github.event_name == 'repository_dispatch'
        run: sleep 300 # Wait 5 minutes to check for more changes

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build & Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          wranglerVersion: 4.73.0
