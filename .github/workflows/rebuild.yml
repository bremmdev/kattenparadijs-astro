name: Rebuild Site

# Trigger the workflow manually or via the CMS update event
on:
  repository_dispatch:
    types: [cms-update]
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: cms-rebuild
  cancel-in-progress: true # cancel any running builds

jobs:
  rebuild:
    runs-on: ubuntu-latest
    env:
      SANITY_DATASET: ${{ secrets.SANITY_DATASET }}
      SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
    steps:
      - name: Wait for more changes (debounce)
        if: github.event_name == 'repository_dispatch'
        run: sleep 300 # Wait 5 minutes to check for more changes

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci --force

      - name: Build site
        run: npm run build

      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
