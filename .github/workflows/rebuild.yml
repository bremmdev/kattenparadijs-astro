name: Rebuild Site

# Trigger the workflow manually or via the CMS update event
on:
  repository_dispatch:
    types: [cms-update]
  workflow_dispatch:

concurrency:
  group: cms-rebuild
  cancel-in-progress: true # cancel any running builds

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for more changes (debounce)
        run: sleep 300 # Wait 5 minutes

      - uses: actions/checkout@v4
      - name: Build & Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
